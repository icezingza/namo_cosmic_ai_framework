version: '3.8'
services:
  infinity-ai:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    image: infinity-ai-framework:2.0.0
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://user:${DB_PASSWORD}@db:5432/infinity_ai
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      - db
      - redis
    volumes:
      - infinity_data:/app/data
      - ../../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=infinity_ai
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backups:/backups
    restart: unless-stopped
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
  redis:
    image: redis:6-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
  monitoring:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - infinity-ai
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - monitoring
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/ssl:/etc/nginx/ssl
    depends_on:
      - infinity-ai
    restart: unless-stopped
  backup:
    image: postgres:13-alpine
    volumes:
      - ../backups:/backups
    environment:
      - PG_HOST=db
      - PG_USER=user
      - PG_PASSWORD=${DB_PASSWORD}
    command: >
      sh -c "echo '0 2 * * * pg_dump -h $$PG_HOST -U $$PG_USER -d infinity_ai > /backups/backup-$$(date +%Y%m%d).sql' > /etc/crontabs/root && crond -f"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  infinity_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: infinity-network
