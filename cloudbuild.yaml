steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/namo-cosmic-ai'
      - '.'

  # Step 2: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/namo-cosmic-ai'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - namo-cosmic-ai
      - --image=gcr.io/$PROJECT_ID/namo-cosmic-ai
      - --region=asia-southeast1
      - --platform=managed
      - --allow-unauthenticated
      - '--set-env-vars=APP_MODULE=crystal_api_main:app,GCP_PROJECT_ID=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/namo-cosmic-ai'
