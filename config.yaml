# This is an example config.yaml for a Vertex AI Custom Job.
# You need to replace the placeholder values with your actual configuration.

# See the documentation for more details:
# https://cloud.google.com/vertex-ai/docs/training/create-custom-job

# The display name of the custom job.
displayName: your-job-display-name

# The specification of the worker pools.
workerPoolSpecs:
  # The machine type to use for the job.
  - machineSpec:
      machineType: n1-standard-4
    # The number of replicas to use.
    replicaCount: 1
    # The specification of the container to run.
    containerSpec:
      # The URI of the container image to run.
      # Replace this with the URI of your container image in Artifact Registry.
      imageUri: asia-southeast1-docker.pkg.dev/your-project-id/your-repo/your-image:latest
